server {
    # Port Nginx listens on inside the container
    listen 80;

    # Directory exposed to the browser (only Symfony's public folder!)
    root /var/www/html/public;

    # 1. All URLs: serve the file if it exists,
    #    otherwise forward the request to Symfony's front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # 2. Requests to index.php are passed to PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # 3. Security: any other .php file returns a 404 error
    location ~ \.php$ {
        return 404;
    }
}